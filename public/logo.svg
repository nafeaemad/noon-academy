<svg width="375" height="220" viewBox="0 0 375 220" xmlns="http://www.w3.org/2000/svg">
  <rect width="375" height="220" rx="34" fill="#f7f5ee"/>

  <!-- tittle dot, echoing the dot above the Arabic letter Noon (ن) -->
  <circle cx="182.5" cy="40" r="10" fill="#0c3b2e"/>

  <!-- n -->
  <path d="M50,165 L50,80 C50,60 100,60 100,85 L100,165"
        fill="none" stroke="#a9843f" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- first o (lighter gold, drawn first so the second o appears to weave over it) -->
  <circle cx="150" cy="115" r="46" fill="none" stroke="#d7bb84" stroke-width="18"/>

  <!-- second o (deeper gold, overlapping the first) -->
  <circle cx="215" cy="115" r="46" fill="none" stroke="#a9843f" stroke-width="18"/>

  <!-- n -->
  <path d="M270,165 L270,80 C270,60 320,60 320,85 L320,165"
        fill="none" stroke="#a9843f" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
